[package]
name = "git-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tower = "0.4"
hyper = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

tower-http = { version = "0.5", features = ["cors"] }

# local crates
git-core = { path = "../git-core" }
sanity = { path = "../sanity" }

[dev-dependencies]
tempfile = "3"
